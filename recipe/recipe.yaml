schema_version: 1

context:
  name: dehinter
  version: "4.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dehinter-${{ version }}.tar.gz
  sha256: 4510ff196caf179052ba578fe43e557024f6d6ce52952920e13e7e6eef74d768

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - dehinter = dehinter.__main__:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - fonttools
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dehinter
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - dehinter --help

about:
  summary: A tool for the removal of TrueType instruction sets (hints) in fonts
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/source-foundry/dehinter

extra:
  recipe-maintainers:
    - jan-janssen
